<svg width="900" height="150" viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1512"/>
      <stop offset="100%" stop-color="#0F0C0A"/>
    </linearGradient>
  </defs>

  <rect width="900" height="150" rx="10" fill="url(#bg)"/>

  <!-- pipeline stages -->
  <!-- Plan -->
  <g>
    <rect x="30" y="55" width="130" height="46" rx="6" fill="#241C16" stroke="#FFB000" stroke-width="1.4"/>
    <text x="95" y="83" fill="#FFB000" font-size="15" font-weight="600" text-anchor="middle">Plan</text>
  </g>
  <path d="M164 78 L192 78" stroke="#7A5A2B" stroke-width="2"/>
  <path d="M186 72 L194 78 L186 84" fill="none" stroke="#7A5A2B" stroke-width="2"/>

  <!-- Build -->
  <g>
    <rect x="196" y="55" width="130" height="46" rx="6" fill="#241C16" stroke="#FFB000" stroke-width="1.4"/>
    <text x="261" y="83" fill="#FFB000" font-size="15" font-weight="600" text-anchor="middle">Build</text>
  </g>
  <path d="M330 78 L358 78" stroke="#7A5A2B" stroke-width="2"/>
  <path d="M352 72 L360 78 L352 84" fill="none" stroke="#7A5A2B" stroke-width="2"/>

  <!-- Test -->
  <g>
    <rect x="362" y="55" width="130" height="46" rx="6" fill="#241C16" stroke="#FFB000" stroke-width="1.4"/>
    <text x="427" y="83" fill="#FFB000" font-size="15" font-weight="600" text-anchor="middle">Test</text>
  </g>
  <path d="M496 78 L524 78" stroke="#7A5A2B" stroke-width="2"/>
