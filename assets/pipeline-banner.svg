  <!-- Deploy -->
  <g>
    <rect x="528" y="55" width="130" height="46" rx="6" fill="#241C16" stroke="#FFB000" stroke-width="1.4"/>
    <text x="593" y="83" fill="#FFB000" font-size="15" font-weight="600" text-anchor="middle">Deploy</text>
  </g>
  <path d="M662 78 L690 78" stroke="#7A5A2B" stroke-width="2"/>
